<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>易經掌握之路 · I Ching Mastery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Cinzel:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* ── Option A: Ink & Parchment ── */
  --p:#F5EDD8;--p2:#EDE0C4;--p3:#E0CFA8;
  --ink:#2C1810;--ink2:#5C3D1E;--ink3:#8B6914;
  --red:#C0392B;--red2:#922B21;
  --gold:#8B6914;--gold2:#C9A84C;
  --jade:#1E6B3A;--jade2:#2D8A50;
  --border:#C9A84C;--lock:#A09080;--sh:rgba(44,24,16,.15);
  --wood:#3a7a2a;--fire:#c0391b;--earth:#9a7a1a;--metal:#5a7a9a;--water:#1a4a8a;
}
html,body{min-height:100%;background:var(--p);}
body{font-family:'Noto Serif TC',serif;color:var(--ink);}
.screen{display:none;}
.screen.visible{display:block;}

/* ── LANGUAGE TOGGLE ── */
.lang-bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:10px 16px;background:var(--p2);border-bottom:1px solid var(--border);}
.lang-btn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;font-family:'Noto Serif TC',serif;font-size:13px;cursor:pointer;color:var(--ink2);transition:all .2s;}
.lang-btn.active{background:var(--ink);color:var(--p);border-color:var(--ink);}
.lang-btn:hover:not(.active){border-color:var(--gold2);}

/* ── SHARED BUTTONS ── */
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink3);font-family:'Noto Serif TC',serif;font-size:13px;cursor:pointer;padding:14px 14px 0;margin-bottom:0;}
.back-btn:hover{color:var(--ink);}
.btn-p{padding:10px 22px;background:var(--red);color:#fff;border:none;border-radius:8px;font-family:'Noto Serif TC',serif;font-size:13px;cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(192,57,43,.3);}
.btn-p:hover{background:var(--red2);box-shadow:0 3px 10px rgba(192,57,43,.4);}
.btn-s{padding:9px 18px;background:var(--p2);border:1px solid var(--border);border-radius:8px;font-family:'Noto Serif TC',serif;font-size:13px;cursor:pointer;color:var(--ink2);transition:all .2s;}
.btn-s:hover{border-color:var(--gold2);color:var(--ink);background:var(--p);}
.btn-gold{padding:10px 22px;background:var(--gold);color:#fff;border:none;border-radius:8px;font-family:'Noto Serif TC',serif;font-size:13px;cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(139,105,20,.3);}
.btn-gold:hover{opacity:.9;box-shadow:0 3px 10px rgba(139,105,20,.4);}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.tag{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap;}
.tag-pass{background:#c8e6c9;color:#1a5c2a;}
.tag-open{background:#fce4e4;color:var(--red);}
.tag-none{background:var(--p3);color:var(--lock);}
.tag-final{background:#fef3c7;color:#7a5a00;}

/* ── HERO / PATH ── */
.path-hero{padding:16px 14px 14px;border-bottom:1px solid var(--border);background:var(--p2);}
.hero-title{font-family:'Cinzel',serif;font-size:19px;font-weight:700;color:var(--red);letter-spacing:2px;margin-bottom:2px;}
.hero-sub{font-size:11px;color:var(--ink3);margin-bottom:12px;line-height:1.5;}
.prog-row{display:flex;align-items:center;gap:10px;}
.prog-track{flex:1;height:6px;background:var(--p3);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:var(--jade);border-radius:3px;transition:width .6s;}
.prog-pct{font-size:12px;color:var(--jade);font-weight:700;min-width:36px;}
.stage-list{padding:10px 12px 24px;}
.group-lbl{font-size:10px;color:var(--lock);letter-spacing:1.5px;margin:16px 0 6px 2px;text-transform:uppercase;font-weight:700;}
.srow{display:flex;gap:8px;margin-bottom:8px;align-items:stretch;}
.snum{font-family:'Cinzel',serif;font-size:14px;color:var(--gold);min-width:22px;padding-top:14px;text-align:center;flex-shrink:0;}
.scard{flex:1;border:1px solid var(--border);border-radius:12px;padding:13px 14px;background:var(--p2);cursor:pointer;transition:all .25s;min-width:0;box-shadow:0 1px 4px var(--sh);}
.scard:hover{border-color:var(--gold2);box-shadow:0 4px 14px var(--sh);transform:translateY(-1px);}
.scard.passed{background:#EEF7EE;border-color:#5a9a6a;}
.scard.final-card{background:#FFFBEF;border-color:var(--gold);}
.scard.final-card.passed{background:#EEF7EE;border-color:#5a9a6a;}
.sc-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.sc-icon{font-size:18px;flex-shrink:0;}
.sc-names{flex:1;min-width:0;}
.sc-zh{font-size:14px;font-weight:700;color:var(--red);}
.sc-en{font-size:10px;color:var(--ink3);}
.sc-desc{font-size:11px;color:var(--ink2);line-height:1.6;margin-bottom:4px;}
.sc-pct{font-size:10px;color:var(--jade);font-weight:700;margin-top:3px;}
.sc-bar-wrap{margin-top:5px;height:4px;background:var(--p3);border-radius:2px;overflow:hidden;}
.sc-bar{height:100%;background:var(--jade);border-radius:2px;transition:width .5s;}
.sc-review{font-size:10px;color:var(--jade2);margin-top:3px;}

/* ── INNER SCREEN ── */
.inner{max-width:820px;margin:0 auto;padding:0 0 34px;}
.inner-title{font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:var(--red);letter-spacing:1px;padding:14px 14px 2px;}
.inner-sub{font-size:12px;color:var(--ink3);padding:0 14px 12px;line-height:1.6;}

/* ── STUDY TABS ── */
.tab-bar{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap;}
.tab-btn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;font-family:'Noto Serif TC',serif;font-size:12px;cursor:pointer;color:var(--ink2);transition:all .2s;font-weight:700;}
.tab-btn.active{background:var(--red);color:#fff;border-color:var(--red);}
.tab-btn:hover:not(.active){border-color:var(--gold2);}
.tab-pane{display:none;padding:0 14px;}
.tab-pane.visible{display:block;}

/* ── CONCEPT BOX ── */
.cbox{background:var(--p2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:13px;box-shadow:0 1px 4px var(--sh);}
.cbox h3{font-size:14px;color:var(--red);margin-bottom:9px;font-family:'Cinzel',serif;font-weight:700;letter-spacing:.5px;}
.cbox p{font-size:13px;color:var(--ink2);line-height:1.75;}
.cbox p+p{margin-top:7px;}

/* ── 口訣 VERSE BOX ── */
.koujue{background:rgba(139,105,20,.08);border:1px solid var(--gold2);border-left:3px solid var(--gold);border-radius:8px;padding:11px 14px;margin:10px 0;font-style:italic;}
.koujue-label{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:1px;margin-bottom:4px;font-style:normal;}
.koujue-zh{font-size:15px;color:var(--ink);line-height:1.7;font-weight:500;}
.koujue-py{font-size:11px;color:var(--ink3);margin-top:2px;}
.koujue-en{font-size:11px;color:var(--ink2);margin-top:4px;line-height:1.5;font-style:normal;}

/* ── FLIP CARDS ── */
.study-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
.flip-card{background:var(--p2);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:all .25s;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 4px var(--sh);}
.flip-card:hover{border-color:var(--gold2);box-shadow:0 3px 10px var(--sh);}
.flip-card.open{border-color:var(--jade);background:#fff;}

/* ── HEX CARDS ── */
.hex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;margin-bottom:14px;}
.hcard{background:var(--p);border:1px solid var(--border);border-radius:10px;padding:11px;cursor:pointer;transition:all .25s;box-shadow:0 1px 3px var(--sh);}
.hcard:hover{border-color:var(--gold2);box-shadow:0 3px 10px var(--sh);}
.hcard.open{border-color:var(--jade);background:#fff;}
.hcard-top{display:flex;gap:8px;align-items:center;margin-bottom:5px;}
.hcard-g{font-size:30px;line-height:1;flex-shrink:0;}
.hcard-zh{font-size:13px;font-weight:700;color:var(--red);}
.hcard-en{font-size:10px;color:var(--ink3);}
.hcard-kw{font-size:10px;color:var(--gold);}
.hcard-theme{font-size:11px;color:var(--jade);font-weight:700;}
.hcard-detail{display:none;margin-top:8px;border-top:1px dashed var(--border);padding-top:8px;}
.hcard.open .hcard-detail{display:block;}
.hcard-meaning{font-size:11px;color:var(--ink2);line-height:1.65;margin-bottom:6px;}
.hcard-mnem{font-size:11px;color:var(--jade);font-style:italic;line-height:1.5;background:rgba(30,107,58,.07);border-radius:6px;padding:6px 8px;margin-bottom:5px;}
.hcard-pair{font-size:10px;display:flex;gap:10px;}

/* ── TRI GROUP ── */
.tri-group{margin-bottom:14px;}
.tgh{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--p);border:1px solid var(--border);border-radius:10px 10px 0 0;}
.tgh-g{font-size:28px;line-height:1;}
.tgh-name{font-size:14px;font-weight:700;color:var(--red);}
.tgh-sub{font-size:11px;color:var(--ink3);}
.tgh-attr{font-size:11px;color:var(--jade);}
.tgh-body{border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;padding:10px;background:var(--p2);}

/* ── FAMILY PATH ── */
.family-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:0 14px 14px;}
.fcard{border:1px solid var(--border);border-radius:11px;padding:13px;background:var(--p2);cursor:pointer;transition:all .25s;box-shadow:0 1px 4px var(--sh);}
.fcard:hover{border-color:var(--gold2);box-shadow:0 4px 12px var(--sh);transform:translateY(-1px);}
.fcard.passed{background:#EEF7EE;border-color:#5a9a6a;}
.fcard-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.fcard-g{font-size:28px;line-height:1;}
.fcard-zh{font-size:14px;font-weight:700;color:var(--red);}
.fcard-en{font-size:10px;color:var(--ink3);}
.fcard-attr{font-size:11px;color:var(--jade);margin-bottom:3px;}
.fcard-count{font-size:10px;color:var(--ink3);}

/* ── 五行 ── */
.wuxing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:14px;}
.wx-card{border-radius:11px;padding:14px;cursor:pointer;transition:all .25s;border:1.5px solid transparent;box-shadow:0 1px 4px var(--sh);}
.wx-card:hover{opacity:.9;transform:translateY(-1px);}
.wx-card.wood{background:#e8f5e3;border-color:#3a7a2a;}
.wx-card.fire{background:#fdecea;border-color:#c0391b;}
.wx-card.earth{background:#fdf6dc;border-color:#9a7a1a;}
.wx-card.metal{background:#e8f0f6;border-color:#5a7a9a;}
.wx-card.water{background:#e3eaf5;border-color:#1a4a8a;}
.wx-elem{font-size:30px;margin-bottom:5px;}
.wx-name-zh{font-size:17px;font-weight:700;margin-bottom:2px;}
.wx-card.wood .wx-name-zh{color:var(--wood);}
.wx-card.fire .wx-name-zh{color:var(--fire);}
.wx-card.earth .wx-name-zh{color:var(--earth);}
.wx-card.metal .wx-name-zh{color:var(--metal);}
.wx-card.water .wx-name-zh{color:var(--water);}
.wx-name-en{font-size:11px;color:var(--ink3);margin-bottom:6px;}
.wx-trigrams{font-size:12px;color:var(--ink2);margin-bottom:4px;}
.wx-season{font-size:11px;font-style:italic;color:var(--ink3);}
.wx-detail{display:none;margin-top:9px;border-top:1px dashed rgba(0,0,0,.12);padding-top:9px;}
.wx-card.open .wx-detail{display:block;}
.wx-detail p{font-size:11px;color:var(--ink2);line-height:1.65;}

/* ── CHECKPOINT / QUIZ ── */
.cp-wrap{padding:0 14px;}
.cp-header{background:var(--p2);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:13px;text-align:center;box-shadow:0 1px 4px var(--sh);}
.cp-title{font-size:14px;color:var(--red);font-weight:700;margin-bottom:3px;}
.cp-sub{font-size:11px;color:var(--ink3);margin-bottom:9px;}
.score-row{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--ink2);}
.sv{font-weight:700;color:var(--red);}
.q-box{background:var(--p2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:11px;box-shadow:0 1px 4px var(--sh);}
.q-prompt{text-align:center;min-height:68px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;}
.q-qt{font-size:13px;text-align:center;color:var(--ink2);margin-bottom:14px;line-height:1.55;}

/* ── QUIZ OPTIONS — responsive, max 4 columns ── */
.q-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:11px;}
.q-opt{padding:14px 8px;border:1px solid var(--border);background:var(--p);border-radius:9px;cursor:pointer;font-family:'Noto Serif TC',serif;font-size:13px;text-align:center;transition:all .2s;color:var(--ink);line-height:1.4;box-shadow:0 1px 3px var(--sh);}
.q-opt:hover{border-color:var(--gold2);background:var(--p2);box-shadow:0 2px 8px var(--sh);}
.q-opt.correct{background:#e8f5e9;border-color:#4a8a5a;color:#1a5c2a;}
.q-opt.wrong{background:#fce4e4;border-color:var(--red);color:var(--red);}
.q-opt.reveal{background:#e8f5e9;border-color:#4a8a5a;}
/* ── GLYPH OPTIONS — large glyphs, max 4 columns ── */
.q-opts.glyph-opts{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));}
.q-opts.glyph-opts .q-opt{font-size:52px;padding:16px 8px;line-height:1.1;}
.q-fb{text-align:center;font-size:13px;min-height:20px;margin-bottom:11px;font-weight:500;}
.pnote{font-size:10px;color:var(--lock);text-align:center;margin-top:9px;}
.pass-box{background:#e8f5e9;border:1px solid #5a9a6a;border-radius:12px;padding:18px;text-align:center;}
.fail-box{background:#fce4e4;border:1px solid #e0a0a0;border-radius:12px;padding:18px;text-align:center;}
.result-icon{font-size:30px;margin-bottom:7px;}
.result-title{font-size:18px;font-weight:700;margin-bottom:6px;}
.pass-box .result-title{color:#1a5c2a;}
.fail-box .result-title{color:var(--red);}
.result-sub{font-size:13px;line-height:1.65;margin-bottom:13px;}
.pass-box .result-sub{color:#2e6e3a;}
.fail-box .result-sub{color:#7a2020;}

/* ── FINAL EXAM ── */
.final-intro{background:#FFFBEF;border:1.5px solid var(--gold);border-radius:12px;padding:18px;margin:0 14px 14px;text-align:center;box-shadow:0 2px 8px var(--sh);}
.final-intro h3{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--gold);margin-bottom:7px;letter-spacing:1px;}
.final-intro p{font-size:12px;color:var(--ink2);line-height:1.65;}

/* ── MISC ── */
.line-demo{display:flex;gap:12px;margin:12px 0;flex-wrap:wrap;}
.line-item{text-align:center;background:var(--p);border:1px solid var(--border);border-radius:10px;padding:12px 16px;box-shadow:0 1px 3px var(--sh);}
.info-row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;}
.info-pill{background:var(--p);border:1px solid var(--border);border-radius:20px;padding:4px 13px;font-size:12px;color:var(--ink2);}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0;}

/* ── PROGRESS RING ── */
.prog-ring-wrap{display:flex;align-items:center;gap:10px;margin-top:6px;}
.prog-ring{transform:rotate(-90deg);}
.prog-ring-track{fill:none;stroke:var(--p3);stroke-width:3;}
.prog-ring-fill{fill:none;stroke:var(--jade);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .6s ease;}

/* ── RESPONSIVE GRID CAPS ── */
.study-grid{grid-template-columns:repeat(2,1fr);}
.hex-grid{grid-template-columns:repeat(2,1fr);}
.wuxing-grid{grid-template-columns:repeat(2,1fr);}
.family-grid{grid-template-columns:repeat(2,1fr);}
@media(min-width:480px){
  .study-grid,.hex-grid{grid-template-columns:repeat(3,1fr);}
  .wuxing-grid{grid-template-columns:repeat(3,1fr);}
}
@media(min-width:700px){
  .study-grid,.hex-grid{grid-template-columns:repeat(4,1fr);}
  .family-grid{grid-template-columns:repeat(4,1fr);}
}

/* ── LANGUAGE-BASED DISPLAY ── */
body:not([data-lang="en"]) .sc-en,
body:not([data-lang="en"]) .hcard-en,
body:not([data-lang="en"]) .fcard-en,
body:not([data-lang="en"]) .koujue-en{display:none;}

/* ── FONT SIZE INCREASES ── */
.lang-btn{font-size:13px;}
.back-btn{font-size:15px;}
.btn-p,.btn-s,.btn-gold{font-size:15px;}
.group-lbl{font-size:12px;}
.hero-title{font-size:22px;}
.hero-sub{font-size:14px;}
.prog-pct{font-size:14px;}
.snum{font-size:16px;}
.sc-zh{font-size:16px;}
.sc-en{font-size:12px;}
.sc-desc{font-size:13px;}
.sc-pct,.sc-review{font-size:12px;}
.inner-title{font-size:18px;}
.inner-sub{font-size:14px;}
.tab-btn{font-size:14px;}
.cbox h3{font-size:16px;}
.cbox p{font-size:15px;}
.koujue-label{font-size:12px;}
.koujue-zh{font-size:16px;}
.koujue-py{font-size:13px;}
.koujue-en{font-size:13px;}
.hcard-zh{font-size:15px;}
.hcard-en,.hcard-kw{font-size:12px;}
.hcard-theme{font-size:13px;}
.hcard-meaning,.hcard-mnem{font-size:13px;}
.hcard-pair{font-size:12px;}
.tgh-name{font-size:16px;}
.tgh-sub,.tgh-attr{font-size:13px;}
.fcard-zh{font-size:16px;}
.fcard-en,.fcard-count{font-size:12px;}
.fcard-attr{font-size:13px;}
.wx-name-zh{font-size:19px;}
.wx-name-en,.wx-season{font-size:13px;}
.wx-trigrams{font-size:14px;}
.wx-detail p{font-size:13px;}
.cp-title{font-size:16px;}
.cp-sub{font-size:13px;}
.score-row{font-size:15px;}
.q-qt{font-size:15px;}
.q-opt{font-size:15px;}
.q-fb{font-size:15px;}
.pnote{font-size:12px;}
.result-title{font-size:20px;}
.result-sub{font-size:15px;}
.final-intro h3{font-size:18px;}
.final-intro p{font-size:14px;}
.info-pill{font-size:14px;}
.tag{font-size:11px;}
</style>
</head>
<body>

<!-- ═══════ PATH SCREEN ═══════ -->
<div id="s-path" class="screen visible">
  <div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('zh-TW',this)">繁體</button>
    <button class="lang-btn" onclick="setLang('zh-CN',this)">简体</button>
    <button class="lang-btn" onclick="setLang('en',this)">EN</button>
  </div>
  <div class="path-hero">
    <div class="hero-title" id="hero-title">易經掌握之路</div>
    <div style="font-family:'Cinzel',serif;font-size:13px;color:var(--gold);letter-spacing:1px;margin-bottom:3px;">I Ching Mastery Path</div>
    <div class="hero-sub" id="hero-sub">循序漸進，以卦象為基石，建立深厚易學根基。<br>Eight modules. One ancient system. Study freely, test when ready.</div>
    <div class="prog-row">
      <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
      <div class="prog-pct" id="prog-pct">0%</div>
    </div>
  </div>
  <div class="stage-list" id="stage-list"></div>
</div>

<!-- ═══════ STUDY SCREEN ═══════ -->
<div id="s-study" class="screen">
  <div class="lang-bar">
    <button class="lang-btn active" id="sb-tw" onclick="setLang('zh-TW',this)">繁體</button>
    <button class="lang-btn" id="sb-cn" onclick="setLang('zh-CN',this)">简体</button>
    <button class="lang-btn" id="sb-en" onclick="setLang('en',this)">EN</button>
  </div>
  <button class="back-btn" onclick="goPath()">← <span id="back-lbl">返回路徑</span></button>

function toSC(str){
  if(LANG!=='zh-CN') return str;
  return str.split('').map(c=>TC2SC[c]||c).join('');
}

function t(zhTW,en){
  if(LANG==='en') return en;
  if(LANG==='zh-CN') return toSC(zhTW);
  return zhTW;
}

function enOnly(str){
  if(LANG!=='en') return str;
  return str.replace(/[　-鿿＀-￯]+\s*/g,'').trim();
}

function hm(obj){
  if(typeof obj==='string') return obj;
  if(LANG==='en') return obj.en;
  if(LANG==='zh-CN') return toSC(obj.zhTW);
  return obj.zhTW;
}

function setLang(lang,btn){
  LANG=lang;
  document.body.dataset.lang=lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.lang-btn').forEach(b=>{
    if(b.textContent==='繁體'&&lang==='zh-TW') b.classList.add('active');
    if(b.textContent==='简体'&&lang==='zh-CN') b.classList.add('active');
    if(b.textContent==='EN'&&lang==='en') b.classList.add('active');
  });
  // Re-render current visible screen
  const vis=document.querySelector('.screen.visible');
  if(vis&&vis.id==='s-path') renderPath();
  else if(vis&&vis.id==='s-study') openStage(curStage);
  else if(vis&&vis.id==='s-family-path') openFamilyPath(curStage);
  else if(vis&&vis.id==='s-final'){renderFinalIntro();updateLangLabels();}

   meaning:{zhTW:'地上加地，純陰承載，滋養萬物。牝馬隨行。',en:'Earth over Earth — pure yin, yielding and nourishing. The mare follows the stallion.'},
   mnem:{zhTW:'兩地相疊，廣袤無垠。隨順而行，包容一切。',en:'Two earths: an endless field. Follow, do not lead. Receive everything.'}},
  {g:'䷂',zh:'屯',en:'Initial Difficulty',kw:3,up:4,lo:3,theme:'艱難開始',
   meaning:{zhTW:'水上雷下，如嫩芽破凍土而出。誕生之路從來不易。',en:'Water over Thunder — a plant pushing through frozen ground. Birth is always hard.'},
   mnem:{zhTW:'雷動於下，水阻於上。奮力突破，春日終來。',en:'Thunder stirs below, water blocks above. Push through — spring will come.'}},
  {g:'䷃',zh:'蒙',en:'Youthful Folly',kw:4,up:5,lo:4,theme:'童蒙求學',
   meaning:{zhTW:'山上水下，山腳湧泉，尚未成河。求師問道，方能明智。',en:'Mountain over Water — the spring at the mountain foot, not yet a river. Seek a teacher.'},
   mnem:{zhTW:'稚嫩之水困於山下。虛心求問，靜以待學。',en:'Young water trapped below the mountain. Ask, be still, and learn.'}},
  {g:'䷄',zh:'需',en:'Waiting',kw:5,up:4,lo:1,theme:'等待時機',
   meaning:{zhTW:'水上天下，雲聚而雨未降。歡欣等待，自信以待時。',en:'Water over Heaven — clouds gathering, rain not yet fallen. Wait with joyful confidence.'},
   mnem:{zhTW:'天欲上升，水雲懸空。雨必將至，喜心等候。',en:'Heaven pushes up but water hovers. Rain will fall. Wait with joy.'}},
  {g:'䷅',zh:'訟',en:'Conflict',kw:6,up:1,lo:4,theme:'訴訟爭執',
   meaning:{zhTW:'天上水下，各執一端，方向相悖。及早尋求調解。',en:'Heaven over Water — each pulling in opposite directions. Seek mediation early.'},
   mnem:{zhTW:'水向下流，天往上升。爭執不休，半途而止為宜。',en:'Water flows down; heaven pulls up. They argue. Stop halfway.'}},
  {g:'䷆',zh:'師',en:'The Army',kw:7,up:2,lo:4,theme:'軍隊紀律',
   meaning:{zhTW:'地上水下，軍隊藏於地中。以德領兵，非以強力。',en:'Earth over Water — an army hidden within the earth. Lead with virtue, not force.'},
   mnem:{zhTW:'眾水潛藏於厚土之下，紀律嚴明之師從一將。',en:'Many waters beneath solid earth — disciplined troops beneath one general.'}},
  {g:'䷇',zh:'比',en:'Holding Together',kw:8,up:4,lo:2,theme:'親比聯合',
   meaning:{zhTW:'水上地下，水滲入土，萬物相連。及時結盟。',en:'Water over Earth — water soaks into earth, binding all together. Seek allies now.'},
   mnem:{zhTW:'水入土中每一縫隙。早日結交，真誠為盟。',en:'Water seeps into every crack of earth. Bond early, bond sincerely.'}},
  {g:'䷈',zh:'小畜',en:'Small Taming',kw:9,up:6,lo:1,theme:'小力積蓄',
   meaning:{zhTW:'風上天下，微風難阻長空。小有阻礙，耐心處之。',en:'Wind over Heaven — a gentle breeze cannot stop the vast sky. Small obstacles; patience.'},
   mnem:{zhTW:'柔風輕拂廣闊長天。雨尚未至，先理小事。',en:'Soft wind against vast heaven. No rain yet. Tend to small things.'}},
  {g:'䷉',zh:'履',en:'Treading',kw:10,up:1,lo:8,theme:'謹慎行事',
   meaning:{zhTW:'天上澤下，踩踏虎尾。謹慎前行，小心翼翼。',en:"Heaven over Lake — treading on the tiger's tail. Proceed with utmost care."},
   mnem:{zhTW:'輕踩虎尾，含笑而行。如此則虎不噬人。',en:"Step lightly on the tiger's tail. Smile. It won't bite."}},
  {g:'䷊',zh:'泰',en:'Peace',kw:11,up:2,lo:1,theme:'天地交泰',
   meaning:{zhTW:'地上天下，陰降陽升，天地交泰，萬物通暢。',en:'Earth over Heaven — yin descends, yang rises; heaven and earth communicate freely.'},
   mnem:{zhTW:'地坐天上，換位相融。泰運當頭，大吉大利。',en:'Earth sits on heaven — switched places to embrace. The great arrives.'}},
  {g:'䷋',zh:'否',en:'Standstill',kw:12,up:1,lo:2,theme:'天地不交',
   meaning:{zhTW:'天上地下，各自退縮，天地不交，萬事閉塞。',en:'Heaven over Earth — each retreating to its corner; no communication, no progress.'},
   mnem:{zhTW:'天往上飛，地往下沉，漸行漸遠。大運離去。',en:'Heaven flies up, earth sinks down — they drift apart. The great departs.'}},
  {g:'䷌',zh:'同人',en:'Fellowship',kw:13,up:1,lo:7,theme:'天下一家',
   meaning:{zhTW:'天上火下，二者皆上升。光明磊落，與人同心協力。',en:'Heaven over Fire — both rise upward together. Unite with others openly, in the light.'},
   mnem:{zhTW:'火與天俱升，志同道合者攜手向上。坦誠待人。',en:'Fire and heaven both rise — kindred spirits ascending together. Be open.'}},
  {g:'䷍',zh:'大有',en:'Great Possession',kw:14,up:7,lo:1,theme:'豐收盈滿',
   meaning:{zhTW:'火上天下，烈日當空，照耀萬物。大富大貴，謙遜自持。',en:'Fire over Heaven — the sun at its zenith, illuminating all. Great wealth; stay humble.'},
   mnem:{zhTW:'火燃天上，無所隱藏。豐收已至，切記謙遜。',en:'Fire blazes above heaven — nothing hidden. Abundance arrives. Stay humble.'}},
  {g:'䷎',zh:'謙',en:'Modesty',kw:15,up:2,lo:5,theme:'謙遜自牧',
   meaning:{zhTW:'地上山下，高山藏於地下。謙遜者終得彰顯。',en:'Earth over Mountain — the tall mountain hidden under earth. The humble are exalted.'},
   mnem:{zhTW:'山自埋於地下。低者終將被抬舉。',en:'Mountain buries itself under earth. The low is always raised up.'}},
  {g:'䷏',zh:'豫',en:'Enthusiasm',kw:16,up:3,lo:2,theme:'雷地奮發',
   meaning:{zhTW:'雷上地下，春雷初動，萬物甦醒。以音樂喜悅鼓舞眾人。',en:'Thunder over Earth — the first thunder of spring. Inspire the people with music and joy.'},
   mnem:{zhTW:'春雷從地而發。音樂與喜悅，激勵眾人前行！',en:'Thunder erupts from earth in spring. Music, joy — mobilise!'}},
  {g:'䷐',zh:'隨',en:'Following',kw:17,up:8,lo:3,theme:'隨時適應',
   meaning:{zhTW:'澤上雷下，雷止於黃昏。隨時應變，順勢而為。',en:'Lake over Thunder — thunder stills at dusk. Adapt to the moment.'},
   mnem:{zhTW:'雷息澤中，夜幕將至。順應時機，隨天地之節律。',en:'Thunder rests in the lake at evening — follow the rhythm of time.'}},
  {g:'䷑',zh:'蠱',en:'Decay',kw:18,up:5,lo:6,theme:'整治腐敗',
   meaning:{zhTW:'山上風下，風困於山下，積腐敗壞。整治敗壞，重新振作。',en:'Mountain over Wind — wind trapped under mountain; stagnation and rot. Fix what is spoiled.'},
   mnem:{zhTW:'風困山下，無法流通。擼起袖子，著手整頓。',en:"Wind can't blow under the mountain. Roll up your sleeves."}},
  {g:'䷒',zh:'臨',en:'Approach',kw:19,up:2,lo:8,theme:'大人蒞臨',
   meaning:{zhTW:'地上澤下，上位者親近下位，以寬厚關懷相待。',en:'Earth over Lake — the high approaches the low with generosity and care.'},
   mnem:{zhTW:'大地俯臨湖澤，威權近至。以寬仁之心相近。',en:'Earth looms over lake — authority draws near. Be generous in approach.'}},
  {g:'䷓',zh:'觀',en:'Contemplation',kw:20,up:6,lo:2,theme:'觀風察民',
   meaning:{zhTW:'風上地下，風行大地，無所不見。觀察在先，行動在後。',en:'Wind over Earth — wind travels everywhere, seeing all. Observe before acting.'},
   mnem:{zhTW:'風掃大地，洞察一切。治理之前，先觀民情。',en:'Wind sweeps across the earth. Watch the land before you rule.'}},
  {g:'䷔',zh:'噬嗑',en:'Biting Through',kw:21,up:7,lo:3,theme:'雷電決斷',
   meaning:{zhTW:'火上雷下，雷電咬斷阻礙。果斷執法，排除障礙。',en:'Fire over Thunder — lightning biting through the obstacle. Apply the law decisively.'},
   mnem:{zhTW:'齒間有物卡住，咬斷即可！',en:"Something stuck between the teeth — bite through it!"}},
  {g:'䷕',zh:'賁',en:'Grace',kw:22,up:5,lo:7,theme:'文飾之美',
   meaning:{zhTW:'山上火下，火光映照黃昏山色。文飾服務於本質，不可本末倒置。',en:'Mountain over Fire — firelight illuminates the mountain at dusk. Beauty serves substance.'},
   mnem:{zhTW:'夕陽火光映山。形式服務內容，而非反其道而行。',en:'Firelight on the mountain at sunset. Form serves content, not the reverse.'}},
  {g:'䷖',zh:'剝',en:'Splitting Apart',kw:23,up:5,lo:2,theme:'陰盛剝陽',
   meaning:{zhTW:'山上地下，山從根基剝落。靜待休養，不可強求。',en:'Mountain over Earth — the mountain erodes from its base. Rest; do not force.'},
   mnem:{zhTW:'五陰蠶食頂上最後一陽。靜以待變，切勿妄動。',en:"Five yin lines eat the last yang on top. Wait it out. Don't act."}},
  {g:'䷗',zh:'復',en:'Return',kw:24,up:2,lo:3,theme:'一陽來復',
   meaning:{zhTW:'地上雷下，一陽歸來，重生於六陰之下。新的循環開始了。',en:'Earth over Thunder — the first yang returns beneath six yin. A new cycle begins.'},
   mnem:{zhTW:'一點陽氣萌於純陰之下。光明回歸，生機復現。',en:'One tiny yang sprouts at the base of pure yin earth. The light returns.'}},
  {g:'䷘',zh:'无妄',en:'Innocence',kw:25,up:1,lo:3,theme:'天真無邪',
   meaning:{zhTW:'天上雷下，依天然本能而動，不存計算之心。',en:'Heaven over Thunder — act from pure natural impulse, without calculation.'},
   mnem:{zhTW:'自然回應，非出謀略。毫無私心隱藏。',en:'React naturally, not strategically. No hidden motive.'}},
  {g:'䷙',zh:'大畜',en:'Great Taming',kw:26,up:5,lo:1,theme:'蓄積大力',
   meaning:{zhTW:'山上天下，大能被抑止。蓄積智慧，方可行動。',en:'Mountain over Heaven — vast energy held in check. Accumulate wisdom before acting.'},
   mnem:{zhTW:'天力衝山，巨能內蓄。積蓄力量，厚積薄發。',en:'Heaven strains against mountain — vast power contained. Store up strength.'}},
  {g:'䷚',zh:'頤',en:'Nourishment',kw:27,up:5,lo:3,theme:'頤養正道',
   meaning:{zhTW:'山上雷下，口之象徵。謹慎飲食，謹言慎行。',en:'Mountain over Thunder — the image of a mouth. Watch what you eat and what you say.'},
   mnem:{zhTW:'上下兩陽如顎，四陰如口。口乃進食出言之所。',en:'Top and bottom yang form the jaw; four yin make the open mouth.'}},
  {g:'䷛',zh:'大過',en:'Great Excess',kw:28,up:8,lo:6,theme:'棟梁彎折',
   meaning:{zhTW:'澤上風下，棟梁超載彎曲。立即行動，否則折斷。',en:'Lake over Wind — the ridgepole overloaded and bending. Act immediately or it breaks.'},
   mnem:{zhTW:'四強陽居中，弱陰在端，棟梁彎折，危在旦夕。',en:'Four strong yangs in the middle, weak yin at ends — the beam bows.'}},
  {g:'䷜',zh:'坎',en:'The Abyss',kw:29,up:4,lo:4,theme:'重重危險',
   meaning:{zhTW:'水上水下，落入深淵，再度跌落。保持中定，切勿慌亂。',en:"Water over Water — falling into the pit, then falling again. Stay centred; don't panic."},
   mnem:{zhTW:'兩重險陷相疊。不必驚慌，水自流過。',en:"Two abysses stacked. Don't panic — the water flows through regardless."}},
  {g:'䷝',zh:'離',en:'The Clinging',kw:30,up:7,lo:7,theme:'光明相附',
   meaning:{zhTW:'火上火下，光明倍增。依附持久之物，切勿燃盡自身。',en:'Fire over Fire — brilliant light doubled. Cling to what is lasting; do not burn out.'},
   mnem:{zhTW:'兩日熊熊燃燒，耀眼奪目。依附能滋養自己的事物。',en:'Two suns blazing. Dazzling light. Cling to what sustains you.'}},
  {g:'䷞',zh:'咸',en:'Influence',kw:31,up:8,lo:5,theme:'感應相吸',
   meaning:{zhTW:'澤上山下，柔順之澤覆於靜止之山。相互感應，不施強力。',en:'Lake over Mountain — the yielding lake atop the still mountain. Mutual influence without force.'},
   mnem:{zhTW:'澤潤山，山承澤。自然感應，無需強迫。',en:'Lake moistens the mountain; mountain supports the lake. No forcing.'}},
  {g:'䷟',zh:'恆',en:'Duration',kw:32,up:3,lo:6,theme:'持之以恆',
   meaning:{zhTW:'雷上風下，雷風相益。以恆常之道持久不懈。',en:'Thunder over Wind — thunder and wind reinforce each other. Endure through consistency.'},
   mnem:{zhTW:'雷與風相輔相成。堅守方向，持之以恆。',en:'Thunder and wind together strengthen each other. Stay the course.'}},
  {g:'䷠',zh:'遯',en:'Retreat',kw:33,up:1,lo:5,theme:'知退保身',
   meaning:{zhTW:'天上山下，陰氣自下滋長，天道退隱。審時度勢，明智退避。',en:'Heaven over Mountain — heaven retreats as yin advances from below. Withdraw wisely.'},
   mnem:{zhTW:'兩陰從下滲入，天退身而行。知進退，善把握時機。',en:'Two yin lines creep in from below. Heaven backs away — clever timing.'}},
  {g:'䷡',zh:'大壯',en:'Great Power',kw:34,up:3,lo:1,theme:'陽盛大壯',
   meaning:{zhTW:'雷上天下，四強陽奮勇向上。以正義駕馭強力。',en:'Thunder over Heaven — four strong yang lines surge upward. Use power with righteousness.'},
   mnem:{zhTW:'雷聲壓天，爆發之力。公羊衝撞籬笆，強而有力。',en:'Thunder atop heaven — explosive strength. The ram butts the fence.'}},
  {g:'䷢',zh:'晉',en:'Progress',kw:35,up:7,lo:2,theme:'日出大地',
   meaning:{zhTW:'火上地下，旭日升於大地之上。穩步前進，展現自我。',en:'Fire over Earth — the sun rising above the earth. Steady, visible progress.'},
   mnem:{zhTW:'太陽升於大地。穩步向前，讓人看見你。',en:'Sun rises over the earth. Advance steadily. Be seen.'}},
  {g:'䷣',zh:'明夷',en:'Darkening of Light',kw:36,up:2,lo:7,theme:'光明受傷',
   meaning:{zhTW:'地上火下，光明被埋於地下。隱藏光芒，方能求存。',en:'Earth over Fire — the brilliant sun buried under earth. Conceal your light to survive.'},
   mnem:{zhTW:'藏光守正——文王身陷囹圄仍堅持。內守真誠，外示謙遜。',en:'Hide your light — King Wen persevered in prison. Stay true inside.'}},
  {g:'䷤',zh:'家人',en:'The Family',kw:37,up:6,lo:7,theme:'家庭倫理',
   meaning:{zhTW:'風上火下，風助火勢，猶如家族倫理維繫整個家庭。',en:'Wind over Fire — wind feeds fire as family roles sustain the whole household.'},
   mnem:{zhTW:'火由內而暖，風將溫暖外傳。各安其位，各盡其責。',en:'Fire warms from within; wind carries warmth outward. Each in their place.'}},
  {g:'䷥',zh:'睽',en:'Opposition',kw:38,up:7,lo:8,theme:'火澤相違',
   meaning:{zhTW:'火上澤下，火升澤降，相違相對，各盡其性。',en:'Fire over Lake — fire rises, lake sinks; opposites yet each fulfils its nature.'},
   mnem:{zhTW:'火與澤方向相反，在小事上對立反能相補。',en:'Fire and lake move opposite — in small matters, opposites complement.'}},
  {g:'䷦',zh:'蹇',en:'Obstruction',kw:39,up:4,lo:5,theme:'山水阻礙',
   meaning:{zhTW:'水上山下，前有險水，後有山阻。廣結善緣，尋求援助。',en:"Water over Mountain — dangerous water ahead, mountain behind. Seek allies."},
   mnem:{zhTW:'前有險阻，退路已斷。轉向西南，前路開通。',en:"Danger in front, can't retreat. Turn to the southwest — the way is open."}},
  {g:'䷧',zh:'解',en:'Deliverance',kw:40,up:3,lo:4,theme:'雷雨解難',
   meaning:{zhTW:'雷上水下，春雷春雨消融冰霜。阻礙已除，前路開通。',en:'Thunder over Water — spring thunder and rain dissolve the frost. The obstruction clears.'},
   mnem:{zhTW:'雷破冰，雨洗塵。阻礙已解，迅速行動。',en:'Thunder breaks the ice; rain washes away the debris. Move quickly.'}},
  {g:'䷨',zh:'損',en:'Decrease',kw:41,up:5,lo:8,theme:'損下益上',
   meaning:{zhTW:'山上澤下，損下益上。減損有時反而是增益。',en:'Mountain over Lake — decrease below to strengthen above. Less is sometimes more.'},
   mnem:{zhTW:'兩碗誠心供奉勝過盛宴虛情。',en:'Two small bowls offered sincerely outweigh grand, insincere feasts.'}},
  {g:'䷩',zh:'益',en:'Increase',kw:42,up:6,lo:3,theme:'損上益下',
   meaning:{zhTW:'風上雷下，二者相互增益向上。損上以益下。',en:'Wind over Thunder — both reinforce each other upward. Take from above to give below.'},
   mnem:{zhTW:'風雷相增強，從有餘者取，施予不足者。',en:'Wind and thunder both intensify — take from those who have much.'}},
  {g:'䷪',zh:'夬',en:'Breakthrough',kw:43,up:8,lo:1,theme:'決斷果敢',
   meaning:{zhTW:'澤上天下，五陽之上尚存一陰。在朝廷公開宣示真相。',en:"Lake over Heaven — one yin remains above five yangs. Proclaim the truth in the king's court."},
   mnem:{zhTW:'一陰頑守頂端，五陽奮力上推。公開宣告，光明正大。',en:"One yin clings at top; five yang push up. Announce it openly."}},
  {g:'䷫',zh:'姤',en:'Coming to Meet',kw:44,up:1,lo:6,theme:'陰長遇陽',
   meaning:{zhTW:'天上風下，一陰出現於五陽之下。意外之事將至。',en:'Heaven over Wind — one yin appears beneath five yangs. Something unexpected arrives.'},
   mnem:{zhTW:'一絲陰氣在五陽之下悄然滋長。切勿讓其悄然主導。',en:"One small yin spreads under five yang. Don't let it quietly take over."}},
  {g:'䷬',zh:'萃',en:'Gathering',kw:45,up:8,lo:2,theme:'澤地聚集',
   meaning:{zhTW:'澤上地下，四方之水匯聚於澤。凝聚眾人，共同聚集。',en:'Lake over Earth — water gathers in the lake from all directions. Assemble the people.'},
   mnem:{zhTW:'四方水流匯聚大澤。召集眾人，共聚一堂。',en:'Waters converge from everywhere into the great lake. Bring people together.'}},
  {g:'䷭',zh:'升',en:'Pushing Upward',kw:46,up:2,lo:6,theme:'地風上升',
   meaning:{zhTW:'地上風下，樹木自然向上生長，不費氣力。',en:'Earth over Wind — the tree grows upward through the earth without strain.'},
   mnem:{zhTW:'嫩苗破土而出，緩慢而不可阻擋。意志終將克服一切。',en:'The sapling pushes through soil — gradual, unstoppable. Will overcomes.'}},
  {g:'䷮',zh:'困',en:'Oppression',kw:47,up:8,lo:4,theme:'澤水困境',
   meaning:{zhTW:'澤上水下，澤水已盡。默默忍耐，言語無益。',en:'Lake over Water — the lake has drained away. Endure in silence; words are useless.'},
   mnem:{zhTW:'湖水乾涸，言語失效。以從容之心堅忍度過。',en:'The lake is empty. Words fail now. Endure with grace.'}},
  {g:'䷯',zh:'井',en:'The Well',kw:48,up:4,lo:6,theme:'木上有水',
   meaning:{zhTW:'水上風下，水井滋養所有前來汲水之人，取之不竭。',en:'Water over Wind — the well nourishes all who come, inexhaustibly.'},
   mnem:{zhTW:'城鎮更迭，水井長存。維護你的根本之源。',en:'Towns change, the well stays. Maintain your source.'}},
  {g:'䷰',zh:'革',en:'Revolution',kw:49,up:8,lo:7,theme:'水火相革',
   meaning:{zhTW:'澤上火下，水火相革，相互轉化。變革須在適當時機方能到來。',en:'Lake over Fire — water and fire transform each other. Change comes at the right moment.'},
   mnem:{zhTW:'等待時機成熟，再果斷行動。革命只在時機成熟時方可發動。',en:'Wait for the right day; then act decisively. Revolution only when the time is ripe.'}},
  {g:'䷱',zh:'鼎',en:'The Cauldron',kw:50,up:7,lo:6,theme:'火風鼎新',
   meaning:{zhTW:'火上風下，神聖之鼎滋養並轉化置於其中的一切。',en:'Fire over Wind — the sacred cauldron nourishes and transforms what is placed within.'},
   mnem:{zhTW:'烹煮智慧與美德，只饗有德之人。',en:'Cook wisdom and virtue together — feed only the worthy.'}},
  {g:'䷲',zh:'震',en:'The Arousing',kw:51,up:3,lo:3,theme:'雷上加雷',
   meaning:{zhTW:'雷上雷下，震驚接連而至。賢者於震動中保持內心平靜。',en:'Thunder over Thunder — shock upon shock. The sage remains calm at the centre.'},

function sh(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('visible'));document.getElementById(id).classList.add('visible');}
function goPath(){sh('s-path');renderPath();}
function shuf(a){return[...a].sort(()=>Math.random()-.5);}
function pick(a,n){return shuf(a).slice(0,n);}
function stageDesc(s){
  if(!s.desc) return s.descStr||'';
  if(typeof s.desc==='string') return s.desc;
  if(LANG==='en') return s.desc.en;
  if(LANG==='zh-CN') return s.desc.zhCN;
  return s.desc.zhTW;
}

/* ════════════════════════════════════════════════════

════════════════════════════════════════════════════ */
function passedCount(){
  return STAGES.filter(s=>{
    if(s.isFamilyStage) return FAMILY_PROGRESS[s.id]&&FAMILY_PROGRESS[s.id].every(f=>f.passed);
    return s.passed;
  }).length+(FINAL_STAGE.passed?1:0);
}

function renderPath(){
  const total=STAGES.length+1;
  const pct=Math.round(passedCount()/total*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('hero-title').textContent=LANG==='en'?'I Ching Mastery Path':(LANG==='zh-CN'?'易经掌握之路':'易經掌握之路');
  document.getElementById('hero-sub').innerHTML=LANG==='en'?'Eight modules. One ancient system. Study freely, test when ready.':(LANG==='zh-CN'?'循序渐进，以卦象为基石，建立深厚易学根基。':'循序漸進，以卦象為基石，建立深厚易學根基。');

  const nums=['1','2','3','4','5','6','7','8'];
  let html='';
  html+=`<div class="group-lbl">${LANG==='en'?'FOUNDATIONS':(LANG==='zh-CN'?'基础':'基礎')}</div>`;
  STAGES.slice(0,5).forEach((s,i)=>{ html+=stageRowHTML(s,i,nums[i]); });
  html+=`<div class="group-lbl">${LANG==='en'?'HEXAGRAM IDENTIFICATION':(LANG==='zh-CN'?'六十四卦识别':'六十四卦識別')}</div>`;
  STAGES.slice(5,8).forEach((s,i)=>{ html+=stageRowHTML(s,i+5,nums[i+5]); });

  const allCorePassed=STAGES.every(s=>{
    if(s.isFamilyStage) return FAMILY_PROGRESS[s.id].every(f=>f.passed);
    return s.passed;
  });
  const fs=FINAL_STAGE.passed?'passed':'';
  const fb=FINAL_STAGE.passed
    ?`<span class="tag tag-pass">✓ ${t('完成','Done')}</span>`
    :allCorePassed
      ?`<span class="tag tag-final">★ ${t('解鎖','Unlocked')}</span>`
      :`<span class="tag tag-none">${t('完成全部後解鎖','Complete all to unlock')}</span>`;
  html+=`<div class="group-lbl">${LANG==='en'?'FINAL':(LANG==='zh-CN'?'终极测验':'終極測驗')}</div>`;
  html+=`<div class="srow"><div class="snum">✦</div>
    <div class="scard final-card ${fs}" onclick="goFinal()">
      <div class="sc-head"><span class="sc-icon">${FINAL_STAGE.icon}</span>
        <div class="sc-names">
          <div class="sc-zh">${LANG==='en'?FINAL_STAGE.en:(LANG==='zh-CN'?FINAL_STAGE.zhSC:FINAL_STAGE.zh)}</div>
          <div class="sc-en">Final Test</div>
        </div>${fb}</div>
      <div class="sc-desc">${t('四十題，涵蓋全部八個模組——掌握之路的終點。','40 questions across all eight modules — the ultimate measure of your mastery.')}</div>
      ${FINAL_STAGE.passed?`<div class="sc-review">🎉 ${t('恭喜！全部完成。','Congratulations — mastery complete!')}</div>`:''}
      <div class="sc-bar-wrap"><div class="sc-bar" style="width:${FINAL_STAGE.passed?100:0}%;background:var(--gold);"></div></div>
    </div></div>`;

  document.getElementById('stage-list').innerHTML=html;
}

function stageRowHTML(s,idx,num){
  let pct=0,badge='',reviewTag='';
  if(s.isFamilyStage){
    const fp=FAMILY_PROGRESS[s.id];
    const p=fp.filter(f=>f.passed).length;
    pct=Math.round(p/8*100);
    badge=pct===100
      ?`<span class="tag tag-pass">✓ ${t('通過','Passed')}</span>`
      :`<span class="tag tag-open">${p}/8 ${t('族','families')}</span>`;
    if(pct===100) reviewTag=`<div class="sc-review">${t('已通過 · 點擊複習','Passed — tap to review')}</div>`;
  } else {
    pct=s.passed?100:0;
    badge=s.passed
      ?`<span class="tag tag-pass">✓ ${t('通過','Passed')}</span>`
      :`<span class="tag tag-open">● ${t('開放','Open')}</span>`;
    if(s.passed) reviewTag=`<div class="sc-review">${t('已通過 · 點擊複習','Passed — tap to review')}</div>`;
  }
  const click=s.isFamilyStage?`onclick="openFamilyPath(${idx})"`:`onclick="openStage(${idx})"`;
  const pctLabel=pct>0?`<div class="sc-pct">${pct}% ${t('完成','complete')}</div>`:'';
  return `<div class="srow">
    <div class="snum" style="font-size:${idx>=5?'14px':'16px'}">${num}</div>
    <div class="scard ${pct===100?'passed':''}" ${click}>
      <div class="sc-head">
        <span class="sc-icon">${s.icon}</span>
        <div class="sc-names">
          <div class="sc-zh">${LANG==='en'?s.en:(LANG==='zh-CN'?(s.zhSC||toSC(s.zh)):s.zh)}</div>
          <div class="sc-en">${s.en}</div>
        </div>${badge}
      </div>
      <div class="sc-desc">${stageDesc(s)}</div>
      ${pctLabel}${reviewTag}
      <div class="sc-bar-wrap"><div class="sc-bar" style="width:${pct}%"></div></div>
    </div></div>`;
}

function openStage(i){
  curStage=i;
  const s=STAGES[i];
  document.getElementById('st-title').textContent=LANG==='en'?s.en:(LANG==='zh-CN'?(s.zhSC||toSC(s.zh)):s.zh);
  document.getElementById('st-sub').textContent=stageDesc(s)+(s.passed?' — '+t('已通過，複習模式。','Passed — review mode.'):'');
  document.getElementById('start-cp-btn').textContent=t('開始測驗 →','Start Test →');
  document.getElementById('later-btn').textContent=t('返回','Back');
  buildStudyTabs(i);
  sh('s-study');updateLangLabels();
}

function buildStudyTabs(i){
  const tb=document.getElementById('st-tabs');
  const sc=document.getElementById('st-content');
  if(i===5||i===6||i===7){
    tb.innerHTML=`
      <button class="tab-btn active" onclick="switchTab(0,this)">${t('上卦分組','By Upper')}</button>
      <button class="tab-btn" onclick="switchTab(1,this)">${t('下卦分組','By Lower')}</button>
      <button class="tab-btn" onclick="switchTab(2,this)">${t('全部六十四卦','All 64')}</button>`;
    sc.innerHTML=`<div id="tc0" class="tab-pane visible">${buildHexGroupHTML('upper')}</div>
      <div id="tc1" class="tab-pane">${buildHexGroupHTML('lower')}</div>
      <div id="tc2" class="tab-pane">${buildHexListHTML()}</div>`;
  } else {
    tb.innerHTML='';
    sc.innerHTML='<div class="tab-pane visible" style="padding:0 14px;">'+buildStudyContent(i)+'</div>';
  }
}

function switchTab(idx,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-pane').forEach((p,i)=>p.classList.toggle('visible',i===idx));
}

  const s=STAGES[curStage];

  document.getElementById('result-box').innerHTML='';
  document.getElementById('q-box').style.display='block';

function buildFamilyQs(grp,tr,field){
  const qs=[];
  grp.forEach(h=>{
    const dec=shuf(HEX.filter(x=>x.kw!==h.kw)).slice(0,3);
    const opts=shuf([h,...dec]);
    qs.push({pr:h.g,big:true,isGlyph:false,q:t('這是哪一卦？','Which hexagram is this?'),opts:opts.map(o=>o.zh+' '+o.en),ans:opts.indexOf(h)});
  });
  grp.forEach(h=>{
    const dec=shuf(HEX.filter(x=>x.kw!==h.kw&&(field==='upper'?x.up!==tr.num:x.lo!==tr.num))).slice(0,3);
    const opts=shuf([h,...dec]);
    qs.push({pr:h.zh+' '+h.en+' #'+h.kw,big:false,isGlyph:true,q:t('哪個符號是此卦？','Which glyph represents this hexagram?'),opts:opts.map(o=>o.g),ans:opts.indexOf(h)});
  });
  grp.forEach(h=>{
    const dec=shuf(grp.filter(x=>x.kw!==h.kw)).slice(0,Math.min(3,grp.length-1));
    if(dec.length<3){const extra=shuf(HEX.filter(x=>x.kw!==h.kw&&!dec.find(d=>d.kw===x.kw))).slice(0,3-dec.length);dec.push(...extra);}
    const opts=shuf([h,...dec]);
    qs.push({pr:h.g,big:true,isGlyph:false,q:t('此卦主題是？','What is the theme of this hexagram?'),opts:opts.map(o=>o.theme+' · '+o.zh),ans:opts.indexOf(h)});
  });
  return shuf(qs).slice(0,Math.min(grp.length*2,16));
}

    {pr:'⚊',big:true,isGlyph:false,q:t('陽爻代表什麼？','Yang represents:'),opts:[t('天 · 主動 · 奇數','Heaven · Active · Odd'),t('地 · 被動 · 偶數','Earth · Passive · Even')],ans:0},
    {pr:'⚋',big:true,isGlyph:false,q:t('陰爻代表什麼？','Yin represents:'),opts:[t('天 · 主動 · 奇數','Heaven · Active · Odd'),t('地 · 被動 · 偶數','Earth · Passive · Even')],ans:1},
    {pr:t('三爻','Three Lines'),big:false,isGlyph:false,q:t('三條爻堆疊形成什麼？','Three stacked lines form:'),opts:[t('一個卦（八卦之一）','One trigram (one of 8)'),t('一條爻','One line')],ans:0},
    {pr:t('六十四卦','64 Hexagrams'),big:false,isGlyph:false,q:t('每個六十四卦由什麼組成？','Each hexagram is made of:'),opts:[t('上卦＋下卦','Upper + Lower trigram'),t('六條陽爻','Six yang lines')],ans:0},
    {pr:t('讀卦方向','Reading Direction'),big:false,isGlyph:false,q:t('卦的爻從哪裡開始讀？','Lines are read from:'),opts:[t('下往上','Bottom to top'),t('上往下','Top to bottom')],ans:0},
    {pr:'☳ 震',big:true,isGlyph:false,q:t('☳ 震（Thunder）的最下面一爻是什麼？','The bottom line of ☳ Thunder is:'),opts:[t('⚊ 陽爻（實線）','⚊ Yang (solid)'),t('⚋ 陰爻（斷線）','⚋ Yin (broken)')],ans:0},
  ];}
  if(i===1){
    TR.forEach(tr=>{const d=pick(TR.filter(x=>x!==tr),3);const o=shuf([tr,...d]);qs.push({pr:tr.g,big:true,isGlyph:false,q:t('這個符號是哪個卦？','Which trigram is this?'),opts:o.map(x=>(LANG==='en'?x.en:x.zh)+' '+x.en),ans:o.indexOf(tr)});});
    TR.forEach(tr=>{const d=pick(TR.filter(x=>x!==tr),3);const o=shuf([tr,...d]);qs.push({pr:(LANG==='en'?tr.en:tr.zh)+' ('+tr.py+')',big:false,isGlyph:true,q:t('哪個符號代表此卦？','Which glyph represents this trigram?'),opts:o.map(x=>x.g),ans:o.indexOf(tr)});});
    return shuf(qs).slice(0,16);
  }
  if(i===2){
    TR.forEach(tr=>{const d=pick(TR.filter(x=>x!==tr),3);const o=shuf([tr,...d]);qs.push({pr:tr.g+' '+(LANG==='en'?tr.en:tr.zh),big:false,isGlyph:false,q:t('象（自然象徵）是什麼？','Natural element is:'),opts:o.map(x=>enOnly(x.el)),ans:o.indexOf(tr)});});
    TR.forEach(tr=>{const d=pick(TR.filter(x=>x!==tr),3);const o=shuf([tr,...d]);qs.push({pr:tr.g+' '+(LANG==='en'?tr.en:tr.zh),big:false,isGlyph:false,q:t('家庭角色是什麼？','Family role is:'),opts:o.map(x=>enOnly(x.fam)),ans:o.indexOf(tr)});});
    TR.forEach(tr=>{const d=pick(TR.filter(x=>x!==tr),3);const o=shuf([tr,...d]);qs.push({pr:tr.g+' '+(LANG==='en'?tr.en:tr.zh),big:false,isGlyph:false,q:t('方位是哪裡？','Cardinal direction is:'),opts:o.map(x=>enOnly(x.dir)),ans:o.indexOf(tr)});});
    return shuf(qs).slice(0,16);
  }
  if(i===3){
    pick(HEX,8).forEach(h=>{
      const ut=trMap[h.up],lt=trMap[h.lo];
      const uD=pick(TR.filter(x=>x!==ut),3),lD=pick(TR.filter(x=>x!==lt),3);
      const uO=shuf([ut,...uD]),lO=shuf([lt,...lD]);
      qs.push({pr:h.g+' '+h.zh,big:true,isGlyph:false,q:t('上卦是什麼？','Upper trigram is:'),opts:uO.map(o=>o.g+' '+(LANG==='en'?o.en:o.zh)),ans:uO.indexOf(ut)});
      qs.push({pr:h.g+' '+h.zh,big:true,isGlyph:false,q:t('下卦是什麼？','Lower trigram is:'),opts:lO.map(o=>o.g+' '+(LANG==='en'?o.en:o.zh)),ans:lO.indexOf(lt)});
    });
    return shuf(qs).slice(0,12);
  }
  if(i===4){
    TR.forEach(tr=>{
      const w=wxMap[tr.wx];
      const decWx=shuf(WUXING.filter(x=>x.id!==tr.wx)).slice(0,3);
      const opts=shuf([w,...decWx]);
      qs.push({pr:tr.g+' '+(LANG==='en'?tr.en:tr.zh),big:false,isGlyph:false,q:t('此卦屬哪個五行？','Which of the Five Elements?'),opts:opts.map(x=>x.emoji+' '+(LANG==='en'?x.en:x.zh)+' '+x.en),ans:opts.indexOf(w)});

    WUXING.forEach(w=>{
      const correct=TR.filter(x=>x.wx===w.id);
      if(correct.length===1){
        const decoys=pick(TR.filter(x=>x.wx!==w.id),3);
        const opts=shuf([correct[0],...decoys]);
        qs.push({pr:w.emoji+' '+(LANG==='en'?w.en:w.zh)+' '+w.en,big:false,isGlyph:false,q:t('哪個卦屬於此五行？','Which trigram belongs to this element?'),opts:opts.map(x=>x.g+' '+(LANG==='en'?x.en:x.zh)),ans:opts.indexOf(correct[0])});
      }
    });
    WUXING.forEach(w=>{
      const decoys=shuf(WUXING.filter(x=>x.id!==w.id)).slice(0,3);
      const opts=shuf([w,...decoys]);
      qs.push({pr:enOnly(w.season),big:false,isGlyph:false,q:t('季節對應哪個五行？','Which element matches this season?'),opts:opts.map(x=>x.emoji+' '+(LANG==='en'?x.en:x.zh)+' '+x.en),ans:opts.indexOf(w)});
    });
    return shuf(qs).slice(0,16);
  }
  if(i===7){
    pick(HEX,10).forEach(h=>{
      const ut=trMap[h.up],lt=trMap[h.lo];
      const uD=pick(TR.filter(x=>x!==ut),3),lD=pick(TR.filter(x=>x!==lt),3);
      const uO=shuf([ut,...uD]),lO=shuf([lt,...lD]);

      qs.push({pr:h.g,big:true,isGlyph:false,q:t('下卦是什麼？','Lower trigram is:'),opts:lO.map(o=>o.g+' '+(LANG==='en'?o.en:o.zh)+' '+o.en),ans:lO.indexOf(lt)});
    });
    return shuf(qs).slice(0,16);
  }
  return qs;
}

function renderQ(){
  updateBoard();
  if(cpIdx>=cpQs.length){showResult(false);return;}
  const q=cpQs[cpIdx];
  answered=false;
  const optsClass=q.isGlyph?'q-opts glyph-opts':'q-opts';
  document.getElementById('q-box').innerHTML=`
    <div class="q-prompt" style="font-size:${q.big?'54px':'17px'};color:var(--ink2)">${q.pr}</div>
    <div class="q-qt">${q.q}</div>
    <div class="${optsClass}" id="q-opts">${q.opts.map((o,i)=>`<button class="q-opt" onclick="selOpt(${i})">${o}</button>`).join('')}</div>
    <div class="q-fb" id="q-fb"></div>
    <div style="text-align:center"><button class="btn-p" id="nxt" style="display:none" onclick="nextQ()">${t('下一題 →','Next →')}</button></div>
    <div class="pnote">${t('第','Question ')} ${cpIdx+1} / ${cpQs.length} ${t('題','')}</div>`;
}

function selOpt(i){
  if(answered)return;answered=true;
  const q=cpQs[cpIdx];
  const btns=document.querySelectorAll('#q-opts .q-opt');
  btns.forEach(b=>b.onclick=null);
  if(i===q.ans){btns[i].classList.add('correct');cpC++;document.getElementById('q-fb').innerHTML=`<span style="color:var(--jade)">✓ ${t('正確！','Correct!')}</span>`;}
  else{btns[i].classList.add('wrong');btns[q.ans].classList.add('reveal');cpW++;document.getElementById('q-fb').innerHTML=`<span style="color:var(--red)">✗ ${t('錯誤 · 正確答案已標出','Incorrect — correct answer shown')}</span>`;}
  document.getElementById('nxt').style.display='inline-block';
  updateBoard();
}

function nextQ(){cpIdx++;if(cpIdx>=cpQs.length){showResult(false);return;}renderQ();}

function updateBoard(){
  document.getElementById('sc-c').textContent=cpC;
  document.getElementById('sc-w').textContent=cpW;
  document.getElementById('sc-r').textContent=Math.max(0,cpQs.length-cpIdx);
}

function showResult(isFamilyQuiz){
  document.getElementById('q-box').style.display='none';
  const passed=cpW===0;
  const s=STAGES[curStage];
  if(passed){
    if(isFamilyQuiz||s.isFamilyStage){
      FAMILY_PROGRESS[curFamilyStageId][curFamilyIdx].passed=true;
      const fp=FAMILY_PROGRESS[curFamilyStageId];
      const allFamPassed=fp.every(f=>f.passed);
      if(allFamPassed)s.passed=true;
      const nextFamIdx=curFamilyIdx+1<8?curFamilyIdx+1:-1;
      document.getElementById('result-box').innerHTML=`<div class="pass-box">
        <div class="result-icon">✓</div>
        <div class="result-title">${t('通過！','Passed!')}</div>
        <div class="result-sub">${t('全部正確！','All correct!')} ${cpQs.length}/${cpQs.length}<br>
          ${allFamPassed?t('🎉 全部八個家族完成！','🎉 All 8 families complete!'):fp.filter(f=>f.passed).length+'/8 '+t('族群已通過','families passed.')}

      s.passed=true;

      document.getElementById('result-box').innerHTML=`<div class="pass-box">
        <div class="result-icon">✓</div>
        <div class="result-title">${t('通過！模組完成！','Passed — module complete!')}</div>
        <div class="result-sub">${t('全部','All ')} ${cpQs.length}/${cpQs.length} ${t('正確！','correct!')}<br>${nextIdx>=0?t('繼續下一模組 → ','Continue to next module: ')+STAGES[nextIdx].zh:t('所有核心模組完成！','All core modules complete!')}</div>

      <div class="result-icon">✗</div>
      <div class="result-title">${t('尚未通過','Not Passed Yet')}</div>
      <div class="result-sub">${t('正確','Correct ')} ${cpC}/${cpQs.length} · ${t('錯誤','Errors: ')} ${cpW}<br>${t('需要全對才能通過。複習後再試。','100% required — review the material and try again.')}</div>

  }

    document.getElementById('fresult-box').innerHTML=`<div class="fail-box">
      <div class="result-icon">✗</div>
      <div class="result-title">${t('尚未通過','Not Passed Yet')}</div>
      <div class="result-sub">${t('正確','Correct ')} ${fC}/${fQs.length} · ${t('錯誤','Errors: ')} ${fW}<br>${t('需要全對才能通過。回到各模組複習後再試。','100% required — review the relevant modules and try again. You\'re closer than you think.')}</div>
      <div class="btn-row" style="justify-content:center;margin-top:12px">
        <button class="btn-p" onclick="startFinal()">${t('重新測驗','Retry')}</button>
        <button class="btn-s" onclick="goPath()">${t('返回路徑','Back to Path')}</button>
      </div></div>`;
  }
}

   INIT

document.body.dataset.lang=LANG;
renderPath();
</script>
